name: secret-scan

# Three layers, ordered by what actually stops a leak:
#
#   1. GitHub's OWN secret scanning + push protection — a repository SETTING, not this file.
#      Settings → Code security and analysis → enable "Secret scanning" and "Push protection".
#      Free on public repositories, and it BLOCKS the push rather than reporting it afterwards.
#      Do this first: prevention beats detection, and it needs no code.
#   2. This workflow — deterministic, repository-specific rules, full history, redacted output.
#   3. `bash scripts/scan-secrets.sh` locally before pushing — the same code path as CI, so
#      "clean in CI" and "clean here" cannot disagree.
#
# What NONE of these layers covers, and why that rule lives in prose rather than a scanner:
#   reports/**/raw/http/*.html.gz (captured response bodies) and *.png are BINARY. gitleaks
#   and GitHub's pattern scanners do not read inside them — verified: the same token is
#   detected in a plain file and missed inside a .gz of that file. So the control for those
#   artifacts is "redact at write time" or "do not commit them", never "the scan will catch it".

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. A push-only trigger cannot catch a secret committed before a rule existed to
    # detect it, and that commit is still in the repository.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (working tree + full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # NOT a shallow clone: a secret added in an older commit is still in the repo, so
          # scanning HEAD alone would report a repository with a leaked key as clean.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Download under its PUBLISHED filename: `sha256sum -c` resolves names from the
          # checksum file, so saving the archive as gitleaks.tar.gz makes the verification
          # step fail with "No such file or directory" rather than checking anything.
          curl -fsSL -o "$asset" "${base}/${asset}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Verify against the publisher's checksum instead of trusting the download.
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan with this repository's rules
        run: bash scripts/scan-secrets.sh --history

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: reports/security/
          if-no-files-found: ignore
          retention-days: 30

  trufflehog-verified:
    name: trufflehog (verified secrets only)
    # Verification makes live lookups against third-party APIs to confirm a credential still
    # works — the highest-signal check before publishing a repo, and too network-heavy for
    # every push. Hence scheduled + manual.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install trufflehog (pinned)
        env:
          TRUFFLEHOG_VERSION: 3.99.1
        run: |
          set -euo pipefail
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          curl -fsSL -o trufflehog.tar.gz "${base}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          tar -xzf trufflehog.tar.gz trufflehog
          sudo install -m 0755 trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      - name: Scan for live credentials
        run: |
          set -uo pipefail
          # --results verified: only credentials confirmed to still work, so this can fail the
          # build without drowning in heuristic false positives.
          trufflehog filesystem . --results verified --json --no-update > trufflehog.json || true
          count=$(jq -s 'length' trufflehog.json 2>/dev/null || echo 0)
          echo "verified live credentials: ${count}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error::trufflehog verified ${count} live credential(s). Rotate them; removal from history is not remediation."
            exit 1
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog.json
          if-no-files-found: ignore
          retention-days: 30

  github-secret-scanning-alerts:
    name: GitHub secret-scanning alerts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - name: List open alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if ! alerts=$(gh api -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/secret-scanning/alerts?state=open&per_page=100" 2>/dev/null); then
            echo "no access to secret-scanning alerts (secret scanning disabled, or the token lacks security-events:read) — that is an UNRUN check, not a clean result" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(printf '%s' "$alerts" | jq 'if type=="array" then length else 0 end')
          echo "open secret-scanning alerts: ${count}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$alerts" | jq -r '.[]? | "- \(.secret_type_display_name) — first seen \(.created_at)"' >> "$GITHUB_STEP_SUMMARY" || true
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error::${count} open secret-scanning alert(s). Close each by ROTATING the credential, not by dismissing the alert."
            exit 1
          fi
